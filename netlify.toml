# Netlify configuration
#
# This site is built by the OneDev CI pipeline and published via
# `netlify deploy --prod --dir _site` (direct upload). Netlify itself does
# not build the project anymore, so no build command / Ruby environment is
# configured here. The prebuilt output in _site is deployed as-is.
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  publish = "_site"

# The compiled enhancement script is fetched by pages on other origins
# (embeds / mirrors of this site), so it must be readable cross-origin.
# Mirrors the Cloudflare Pages rule in `_headers`.
[[headers]]
  for = "/assets/js/chirpy-enhance.min.js"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, HEAD, OPTIONS"
    Cross-Origin-Resource-Policy = "cross-origin"
