    margin: 0;

    align-items: flex-start;
    display: flex;
    flex-direction: column;
    justify-content: center;

    .ErrorPage h1.ErrorPage-title { font-size: 30px; }

      align-items: center;
      min-width: auto;

<script>
  (function () {
    var back = document.querySelector('.ErrorPage-goBackButton');
    if (!back) return;

    back.addEventListener('click', function () {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = '{{ '/' | relative_url }}';
      }
    });
  })();
</script>
