version: 47

# Build is dependency-only and reused per commit.
# Deploy jobs are independent and consume published _site artifacts.
# GitHub Sync does not consume artifacts; it checks out and pushes source.
# Job-level retries handle common network failures when accessing GitHub from mainland China.

jobs:

# Build: artifact producer with no trigger. It is started by downstream jobs and reused for the same commit.
- name: Build
  steps:

  - type: CheckoutStep
    name: checkout
    cloneCredential:
      type: DefaultCredential
    condition: SUCCESSFUL
    optional: false

  - type: CommandStep
    name: install dependencies
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        set -e
        BUILD_DIR="/tmp/exyone-blog-build"
        rm -rf "$BUILD_DIR"
        mkdir -p "$BUILD_DIR"
        cp -r . "$BUILD_DIR/"
        cd "$BUILD_DIR"
        export PATH="/usr/local/bin:$PATH"
        ruby --version
        bundle --version
        export BUNDLE_JOBS=4
        export BUNDLE_RETRY=3
        bundle install
    useTTY: false
    condition: SUCCESSFUL
    optional: false

  - type: CommandStep
    name: build site
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        set -e
        cd /tmp/exyone-blog-build
        export JEKYLL_ENV="production"
        bundle exec jekyll build
        if [ ! -d "_site" ]; then
          echo "Build failed! _site directory not found."
          exit 1
        fi
        if [ ! -f "_site/friends/index.html" ]; then
          echo "Build failed! _site/friends/index.html not found."
          exit 1
        fi
        if [ ! -f "_site/assets/js/chirpy-enhance.min.js" ]; then
          echo "Build failed! _site/assets/js/chirpy-enhance.min.js not found."
          exit 1
        fi
        echo "Build successful! _site size:"
        du -sh _site/
    useTTY: false
    condition: SUCCESSFUL
    optional: false

  # Publish _site/** for downstream jobs; '**' preserves the _site/ directory structure.
  - !PublishArtifactStep
    name: publish site
    artifacts: '_site/**'
    condition: SUCCESSFUL
    optional: false

  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 3600


# Deploy: Cloudflare Pages
- name: Deploy to Cloudflare Pages
  steps:

  - type: CommandStep
    name: deploy to cloudflare pages
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        set -e
        export PATH="/usr/local/bin:$(npm root -g):$PATH"
        if ! command -v wrangler &> /dev/null; then
          npm install -g wrangler
        fi
        export CLOUDFLARE_API_TOKEN="@secret:cloudflare-api-token@"
        export CLOUDFLARE_ACCOUNT_ID="@secret:cloudflare-account-id@"
        npx wrangler pages deploy _site \
          --project-name exyone \
          --branch main \
          --commit-dirty=true
    useTTY: false
    condition: SUCCESSFUL
    optional: false

  triggers:
  - type: BranchUpdateTrigger
    branches: main
    userMatch: anyone

  jobDependencies:
  - jobName: Build
    requireSuccessful: true
    artifacts: '**'

  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 1800


# Deploy: Netlify
- name: Deploy to Netlify
  steps:

  - type: CommandStep
    name: deploy to netlify
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        set -e
        export PATH="/usr/local/bin:$(npm root -g):$PATH"
        npx netlify-cli deploy --prod \
          --dir _site \
          --site "@secret:netlify-site-id@" \
          --auth "@secret:netlify-auth-token@" \
          --message "OneDev build #@build_number@"
    useTTY: false
    condition: SUCCESSFUL
    optional: false

  triggers:
  - type: BranchUpdateTrigger
    branches: main
    userMatch: anyone

  jobDependencies:
  - jobName: Build
    requireSuccessful: true
    artifacts: '**'

  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 1800


# Deploy: Codeberg Pages (git push)
- name: Deploy to Codeberg Pages
  steps:

  - type: CommandStep
    name: deploy to codeberg pages
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        set -e
        DEPLOY_DIR="/tmp/codeberg-deploy"
        export HOME="${HOME:-/tmp/onedev-home}"
        mkdir -p "$HOME"
        rm -rf "$DEPLOY_DIR"
        git clone "@secret:codeberg-pages-repo-url@" "$DEPLOY_DIR" --depth 1
        find "$DEPLOY_DIR" -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
        cp -r _site/* "$DEPLOY_DIR/"
        cd "$DEPLOY_DIR"
        git config user.email "[email protected]"
        git config user.name "OneDev CI"
        echo "exyone.de5.net" > .domains
        git add .
        git commit -m "Deploy: Update site from OneDev build #@build_number@"
        git push -f origin main
    useTTY: false
    condition: SUCCESSFUL
    optional: false

  triggers:
  - type: BranchUpdateTrigger
    branches: main
    userMatch: anyone

  jobDependencies:
  - jobName: Build
    requireSuccessful: true
    artifacts: '**'

  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 1800


# Deploy: GitLink Pages (git push)
- name: Deploy to GitLink Pages
  steps:

  - type: CommandStep
    name: deploy to gitlink pages
    runInContainer: false
    interpreter:
