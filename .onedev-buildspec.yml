# Backup: push source to Codeberg. It does not consume _site and runs independently of Build.
- name: Backup to Codeberg
  steps:

  - type: CheckoutStep
    name: checkout
    cloneCredential:
      type: DefaultCredential
    condition: SUCCESSFUL
    optional: false

  - type: CommandStep
    name: push to codeberg
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        set -e
        export HOME="${HOME:-/tmp/onedev-home}"
        mkdir -p "$HOME"
        git config --global user.email "[email protected]"
        git config --global user.name "OneDev CI"
        git remote remove codeberg 2>/dev/null || true
        git remote add codeberg '@secret:codeberg-backup-repo-url@'
        git push codeberg --all --force
        git push codeberg --tags --force
    useTTY: false
    condition: SUCCESSFUL
    optional: false

  triggers:
  - type: BranchUpdateTrigger
    branches: main
    userMatch: anyone
  - type: TagCreateTrigger

  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 600


# Sync: push source to GitHub. It does not depend on Build.
# Job-level retries cover DNS resolution failures, connection timeouts, and other
# network errors commonly seen when accessing GitHub from mainland China.
# maxRetries: 100; retryDelay: 60s; timeout: 300s per attempt.
# Retry applies to the whole job; git push --force is idempotent.
- name: Sync to GitHub
  steps:

  - type: CheckoutStep
    name: checkout
    cloneCredential:
      type: DefaultCredential
    condition: SUCCESSFUL
    optional: false

  - type: CommandStep
    name: push source to github
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        set -e
        export HOME="${HOME:-/tmp/onedev-home}"
        mkdir -p "$HOME"
        git config --global user.email "[email protected]"
        git config --global user.name "OneDev CI"
        git remote remove github 2>/dev/null || true
        git remote add github '@secret:github-sync-repo-url@'
        # Push source only: branches and tags, not _site or build artifacts.
        git push github --all --force
        git push github --tags --force
    useTTY: false
    condition: SUCCESSFUL
    optional: false

  triggers:
  - type: BranchUpdateTrigger
    branches: main
    userMatch: anyone
  - type: TagCreateTrigger

  # Retry common network errors when accessing GitHub from mainland China.
  retryCondition: '"Log" contains "Could not resolve host" or "Log" contains "Connection timed out" or "Log" contains "Failed to connect" or "Log" contains "unable to access" or "Log" contains "Connection reset"'
  maxRetries: 100
  retryDelay: 60
  timeout: 300