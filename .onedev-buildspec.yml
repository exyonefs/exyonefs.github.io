version: 47

# Build once into /tmp/exyone-blog-build/_site and deploy that same directory
# everywhere. Deploy steps are optional, so one failing target blocks nothing.

jobs:

- name: Build & Deploy
  steps:

  - type: CheckoutStep
    name: checkout
    cloneCredential:
      type: DefaultCredential
    condition: SUCCESSFUL
    optional: false

  - type: CommandStep
    name: install dependencies
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        set -e
        BUILD_DIR="/tmp/exyone-blog-build"
        rm -rf "$BUILD_DIR"
        mkdir -p "$BUILD_DIR"
        cp -r . "$BUILD_DIR/"
        cd "$BUILD_DIR"
        export PATH="/usr/local/bin:$PATH"
        export BUNDLE_JOBS=4
        export BUNDLE_RETRY=3
        bundle install
    useTTY: false
    condition: SUCCESSFUL
    optional: false

  - type: CommandStep
    name: build site
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        set -e
        BUILD_DIR="/tmp/exyone-blog-build"
        cd "$BUILD_DIR"
        export JEKYLL_ENV="production"

        # Rebuild _frontend assets so stale committed output cannot ship.
        if [ -f package.json ]; then
          npm install
          npm run typecheck
          npm run build
        fi

        bundle exec jekyll build
        for f in _site/friends/index.html _site/assets/js/chirpy-enhance.min.js; do
          if [ ! -f "$f" ]; then
            echo "Build failed! $f not found."
            exit 1
          fi
        done
        du -sh _site/
    useTTY: false
    condition: SUCCESSFUL
    optional: false

  - !PublishArtifactStep
    name: publish site
    artifacts: '_site/**'
    condition: SUCCESSFUL
    optional: false

  - type: SetBuildVersionStep
    name: set build version
    buildVersion: '@build_number@'
    condition: SUCCESSFUL
    optional: false

  - type: CommandStep
    name: deploy to cloudflare pages
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        set -e
        cd /tmp/exyone-blog-build
        export PATH="/usr/local/bin:$(npm root -g):$PATH"
        if ! command -v wrangler &> /dev/null; then
          npm install -g wrangler
        fi
        export CLOUDFLARE_API_TOKEN="@secret:cloudflare-api-token@"
        export CLOUDFLARE_ACCOUNT_ID="@secret:cloudflare-account-id@"
        npx wrangler pages deploy _site \
          --project-name exyone \
          --branch main \
          --commit-dirty=true
    useTTY: false
    condition: ALWAYS
    optional: true

  - type: CommandStep
    name: deploy to netlify
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        set -e
        cd /tmp/exyone-blog-build
        export PATH="/usr/local/bin:$(npm root -g):$PATH"
        NETLIFY_SITE_ID="@secret:netlify-site-id@"
        NETLIFY_TOKEN="@secret:netlify-auth-token@"
        npx netlify-cli deploy --prod \
          --dir _site \
          --site "$NETLIFY_SITE_ID" \
          --auth "$NETLIFY_TOKEN" \
          --message "OneDev #@build_number@"
    useTTY: false
    condition: ALWAYS
    optional: true

  # Register _site as a git repo after CF/Netlify so they never upload .git.
  - type: CommandStep
    name: init artifact git repo
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        set -e
        export HOME="${HOME:-/tmp/onedev-home}"
        mkdir -p "$HOME"
        cd /tmp/exyone-blog-build/_site
        rm -rf .git
        git init
        git checkout -b main
        git config user.email "[email protected]"
        git config user.name "OneDev CI"
        # Codeberg Pages custom domain; a dotfile for the other hosts.
        echo "exyone.de5.net" > .domains
        git add -A
        git commit -m "Deploy: Update site from OneDev build #@build_number@"
    useTTY: false
    condition: ALWAYS
    optional: true

  - type: CommandStep
    name: deploy to codeberg pages
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        set -e
        export HOME="${HOME:-/tmp/onedev-home}"
        mkdir -p "$HOME"
        REPO_URL='@secret:codeberg-pages-repo-url@'
        # Logs mask the secret as *****, so require a URL scheme up front.
        case "$REPO_URL" in
          *://*) ;;
          *)
            echo "codeberg-pages-repo-url must be a full URL with a scheme, got '$REPO_URL'"
            exit 1
            ;;
        esac
        cd /tmp/exyone-blog-build/_site
        git remote remove codeberg 2>/dev/null || true
        git remote add codeberg "$REPO_URL"
        git push --force codeberg main:main
    useTTY: false
    condition: ALWAYS
    optional: true

  - type: CommandStep
    name: deploy to gitlink pages
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        set -e
        export HOME="${HOME:-/tmp/onedev-home}"
        mkdir -p "$HOME"
        REPO_URL='@secret:gitlink-pages-repo-url@'
        case "$REPO_URL" in
          *://*) ;;
          *)
            echo "gitlink-pages-repo-url must be a full URL with a scheme, got '$REPO_URL'"
            exit 1
            ;;
        esac
        cd /tmp/exyone-blog-build/_site
        git remote remove gitlink 2>/dev/null || true
        git remote add gitlink "$REPO_URL"
        git push --force gitlink main:main
    useTTY: false
    condition: ALWAYS
    optional: true

  triggers:
  - type: BranchUpdateTrigger
    branches: main
    userMatch: anyone

  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 3600


- name: Sync to Codeberg
  steps:

  - type: CheckoutStep
    name: checkout
    cloneCredential:
      type: DefaultCredential
    condition: SUCCESSFUL
    optional: false

  - type: CommandStep
    name: push source to codeberg
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        set -e
        export HOME="${HOME:-/tmp/onedev-home}"
        mkdir -p "$HOME"
        git config --global user.email "[email protected]"
        git config --global user.name "OneDev CI"
        git remote remove codeberg 2>/dev/null || true
        git remote add codeberg '@secret:codeberg-sync-repo-url@'
        git push codeberg --all --force
        git push codeberg --tags --force
    useTTY: false
    condition: SUCCESSFUL
    optional: false

  triggers:
  - type: BranchUpdateTrigger
    branches: main
    userMatch: anyone
  - type: TagCreateTrigger

  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 600


# Retry on network errors when reaching GitHub from mainland China.
- name: Sync to GitHub
  steps:

  - type: CheckoutStep
    name: checkout
    cloneCredential:
      type: DefaultCredential
    condition: SUCCESSFUL
    optional: false

  - type: CommandStep
    name: push source to github
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        set -e
        export HOME="${HOME:-/tmp/onedev-home}"
        mkdir -p "$HOME"
        git config --global user.email "[email protected]"
        git config --global user.name "OneDev CI"
        REPO_URL='@secret:github-sync-repo-url@'
        # Secrets are masked as ***** in logs, so surface the shape instead.
        case "$REPO_URL" in
          *://*) echo "github-sync-repo-url: scheme ok, length ${#REPO_URL}" ;;
          *)
            echo "github-sync-repo-url has no URL scheme; git treats it as a local path"
            exit 1
            ;;
        esac
        git remote remove github 2>/dev/null || true
        git remote add github "$REPO_URL"
        # Source only: branches and tags, not _site.
        git push github --all --force
        git push github --tags --force
    useTTY: false
    condition: SUCCESSFUL
    optional: false

  triggers:
  - type: BranchUpdateTrigger
    branches: main
    userMatch: anyone
  - type: TagCreateTrigger

  # OneDev grammar: "Log" contains "<regex>", joined by lowercase or/and.
  retryCondition: '"Log" contains "Could not resolve host" or "Log" contains "Connection timed out" or "Log" contains "Failed to connect" or "Log" contains "Connection reset" or "Log" contains "early EOF"'
  maxRetries: 100
  retryDelay: 60
  timeout: 300
